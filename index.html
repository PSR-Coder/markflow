<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarkFlow — Markdown Editor</title>
  <meta name="description" content="Local-first Markdown editor: live preview, visual tables, smart images, beautiful PDF export. No signup. Your words never leave your browser." />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-512.png" />
  <meta name="theme-color" content="#6d5ae7" />
  <script>
    // Prevent theme flash before CSS loads
    (function () {
      try {
        var t = localStorage.getItem('mf-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="icon-btn" title="Toggle document library" aria-label="Toggle document library">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 3h12M2 8h12M2 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        </button>
        <span class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="1.5" y="3" width="21" height="18" rx="4" fill="var(--accent)"/><path d="M6 16V8l3.2 4.4L12.4 8v8M15.5 8.5h4M17.5 8.5V16" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span class="brand-name">MarkFlow</span>
        </span>
        <input id="docTitle" class="doc-title" type="text" placeholder="Untitled document" spellcheck="false" aria-label="Document title" />
        <span id="saveState" class="save-state" title="All changes are stored locally in your browser">Saved</span>
      </div>
      <div class="topbar-right">
        <div class="mode-switch" role="tablist" aria-label="View mode">
          <button data-mode="source" role="tab" title="Source only">Source</button>
          <button data-mode="split" role="tab" class="active" title="Editor and preview side by side">Split</button>
          <button data-mode="preview" role="tab" title="Preview only">Preview</button>
        </div>
        <button id="exportBtn" class="btn ghost" title="Export document">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2v8m0 0L5 7m3 3 3-3M3 12v1.5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          Export
        </button>
        <button id="themeToggle" class="icon-btn" title="Toggle dark / light theme" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 16 16" width="16" height="16"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8 5.6 5.6 0 1 0 13.2 9.6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>
    </header>

    <div id="workbench">
      <aside id="sidebar" aria-label="Document library">
        <div class="sidebar-head">
          <button id="newDocBtn" class="btn primary block">+ New document</button>
          <div class="search-wrap">
            <svg viewBox="0 0 16 16" width="13" height="13"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="m10.6 10.6 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="docSearch" type="search" placeholder="Search documents…" aria-label="Search documents" />
          </div>
        </div>
        <div id="docList" class="doc-list" role="list"></div>
        <div class="sidebar-foot">
          <button id="historyBtn" class="btn ghost small" title="Version history of current document">
            <svg viewBox="0 0 16 16" width="13" height="13"><path d="M2.5 8a5.5 5.5 0 1 1 1.6 3.9M2.5 8H1m1.5 0L4 6.5M8 5v3.2l2.2 1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            History
          </button>
          <button id="downloadAllBtn" class="btn ghost small" title="Download every document as a .zip backup">
            <svg viewBox="0 0 16 16" width="13" height="13"><path d="M8 2v7m0 0L5.4 6.4M8 9l2.6-2.6M3 11.5V13a1.5 1.5 0 0 0 1.5 1.5h7A1.5 1.5 0 0 0 13 13v-1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            Backup all
          </button>
          <button id="importBackupBtn" class="btn ghost small" title="Restore documents from a MarkFlow backup ZIP">
            Import
          </button>
          <input id="backupFileInput" type="file" accept=".zip,application/zip" hidden aria-label="Choose a MarkFlow backup ZIP" />
        </div>
      </aside>

      <main id="main">
        <div id="toolbar" role="toolbar" aria-label="Formatting toolbar"></div>
        <div id="panes">
          <div id="editorPane"></div>
          <div id="previewPane"><article id="preview" class="markdown-body"></article></div>
        </div>
        <footer id="statusbar">
          <span id="statusStats">0 words</span>
          <span class="status-sep"></span>
          <span id="statusCursor">Ln 1, Col 1</span>
          <span class="status-grow"></span>
          <span id="statusHint" class="status-hint">Local-first · nothing leaves your browser</span>
          <button id="shortcutsBtn" class="status-btn" title="Keyboard shortcuts">?</button>
        </footer>
      </main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
